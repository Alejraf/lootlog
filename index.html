<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<!-- Seguridad: solo permite código y recursos de esta propia página (bloquea scripts inyectados).
     Si integras anuncios reales (AdSense, etc.) deberás ampliar esta política con sus dominios. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; manifest-src blob:; worker-src 'self'; connect-src https://*.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LootLog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3a6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 12l16 8v16c0 8-7 13-16 16-9-3-16-8-16-16V20z' fill='%230f1222' opacity='.25'/%3E%3Cpath d='M20 33l8 8 16-18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1222; --card: #1a1f38; --card-2: #222849; --text: #e8eaf6; --muted: #8b91b8;
    --accent: #7c5cff; --accent-2: #22d3a6; --border: #2d3358; --radius: 16px;
  }
  :root[data-theme="light"] {
    --bg: #f3f4fb; --card: #ffffff; --card-2: #eceefa; --text: #1b1f3b; --muted: #6b7099; --border: #dcdff2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4; transition: background .25s, color .25s; }
  body.has-ad { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }

  header { position: sticky; top: 0; z-index: 10; background: linear-gradient(180deg, var(--bg) 85%, transparent); padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .title-row { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; flex: none; }
  .brand { flex: 1; min-width: 0; }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: .3px; line-height: 1.1; }
  h1 span { color: var(--accent-2); }
  .subtitle { color: var(--muted); font-size: .75rem; margin-top: 2px; }
  .icon-btn { height: 40px; min-width: 40px; padding: 0 10px; flex: none; border-radius: 12px; font-size: 1rem; background: var(--card); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-weight: 700; }
  .stat-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: .85rem; }
  .stat-row b { font-size: 1rem; }
  .stat-row .game { color: var(--muted); }
  .bar { height: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .4s ease; }
  .tools { display: flex; gap: 8px; margin-top: 12px; }
  .tools input[type="search"] { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; }
  .tools input[type="search"]:focus { border-color: var(--accent); }
  .chip { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 12px; padding: 0 12px; font-size: .8rem; cursor: pointer; white-space: nowrap; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Contador de orbes */
  .orbs { display: flex; align-items: center; gap: 10px; margin-top: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; font-size: .8rem; transition: box-shadow .4s, border-color .4s; }
  .orbs .orb-list { display: flex; gap: 6px; flex: 1; justify-content: center; }
  .orb { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); background: var(--card-2); transition: all .3s; }
  .orb.on { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffb300 60%, #e67e00); border-color: #ffb300; box-shadow: 0 0 8px rgba(255,179,0,.7); }
  .orbs b { white-space: nowrap; }
  .orbs.full { border-color: #ffb300; box-shadow: 0 0 16px rgba(255,179,0,.55); }
  .orbs.full .orb { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.18); } }

  main { padding: 4px 16px 60px; max-width: 640px; margin: 0 auto; }
  .category { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .cat-head { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 14px 16px; cursor: pointer; }
  .cat-icon { font-size: 1.5rem; }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name { font-weight: 700; }
  .cat-count { color: var(--muted); font-size: .8rem; }
  .mini-bar { height: 4px; background: var(--card-2); border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .mini-bar > span { display: block; height: 100%; background: var(--accent-2); width: 0; transition: width .3s; }
  .chev { color: var(--muted); transition: transform .25s; font-size: 1.2rem; }
  .category.open .chev { transform: rotate(90deg); }
  .category.done .cat-count { color: var(--accent-2); font-weight: 600; }
  .items { display: none; padding: 0 8px 8px; }
  .category.open .items { display: block; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 12px; cursor: pointer; user-select: none; min-height: 48px; }
  .item:active { background: var(--card-2); }
  .item input { display: none; }
  .box { width: 24px; height: 24px; flex: none; border-radius: 8px; border: 2px solid var(--border); display: grid; place-items: center; transition: all .2s; color: transparent; font-size: 14px; font-weight: 900; }
  .item.checked .box { background: var(--accent-2); border-color: var(--accent-2); color: #0f1222; }
  .label { flex: 1; min-width: 0; transition: color .2s; }
  .label small { display: block; color: var(--muted); font-size: .75rem; }
  .item.checked .label { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
  .item.checked .label small { text-decoration: line-through; }
  .item.hidden { display: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; display: none; }

  /* Pistas */
  .hint-btn { flex: none; width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border); background: var(--card-2); color: var(--text); font-size: 1rem; cursor: pointer; transition: transform .15s; }
  .hint-btn:active { transform: scale(.92); }
  .hint-btn.unlocked { border-color: var(--accent-2); }
  .label small.hint { display: none; margin-top: 4px; color: var(--accent-2); font-size: .78rem; text-decoration: none; }
  .item.hint-open .label small.hint { display: block; }
  .item.checked .label small.hint { text-decoration: none; }

  /* Objetos dentro de cada paquete */
  .parts-btn { flex: none; min-width: 52px; height: 38px; padding: 0 8px; border-radius: 11px; border: 1px solid var(--border); background: var(--card-2); color: var(--text); font-size: .78rem; font-weight: 700; cursor: pointer; transition: transform .15s; }
  .parts-btn:active { transform: scale(.92); }
  .parts-btn.full { border-color: var(--accent-2); color: var(--accent-2); }
  .parts { display: none; margin: 0 0 6px 36px; padding: 4px 0 6px 12px; border-left: 2px solid var(--border); }
  .item.parts-open + .parts { display: block; }
  .item.hidden + .parts { display: none; }
  .part { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-radius: 10px; cursor: pointer; user-select: none; min-height: 44px; font-size: .92rem; }
  .part:active { background: var(--card-2); }
  .part input { display: none; }
  .pbox { width: 20px; height: 20px; flex: none; border-radius: 6px; border: 2px solid var(--border); display: grid; place-items: center; transition: all .2s; color: transparent; font-size: 12px; font-weight: 900; }
  .part.on .pbox { background: var(--accent-2); border-color: var(--accent-2); color: #0f1222; }
  .part.on .ptxt { color: var(--muted); text-decoration: line-through; }

  .support-card { max-width: 640px; margin: 0 auto 40px; padding: 0 16px; display: none; }
  .support-card a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); background: var(--card); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 14px 16px; }
  .support-card small { display: block; color: var(--muted); font-size: .75rem; }

  /* Banner publicitario (simulado) */
  .ad-banner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--card); border-top: 1px solid var(--border); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); min-height: 52px; }
  .ad-tag { flex: none; background: #ffb300; color: #1b1f3b; font-weight: 800; font-size: .65rem; padding: 2px 6px; border-radius: 5px; }
  .ad-text { flex: 1; min-width: 0; color: var(--muted); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ad-remove { flex: none; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 7px 12px; font-size: .72rem; font-weight: 700; cursor: pointer; }
  body.has-ad .toast { bottom: 80px; }

  /* Hoja de opciones */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--card); border-top: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .3s ease; max-width: 640px; margin: 0 auto; max-height: 90vh; overflow-y: auto; }
  .sheet.show { transform: translateY(0); }
  .grab { width: 40px; height: 4px; background: var(--border); border-radius: 9px; margin: 0 auto 12px; }
  .sheet h2 { font-size: 1rem; margin: 0 0 10px; }
  .opt { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card-2); border: 0; color: var(--text); font: inherit; border-radius: 14px; padding: 14px; margin-bottom: 8px; cursor: pointer; text-decoration: none; }
  .opt small { display: block; color: var(--muted); font-size: .75rem; }
  .opt .oi { font-size: 1.3rem; }
  .opt.danger { color: #ff6b81; }
  .opt:active { filter: brightness(.95); }
  .privacy { color: var(--muted); font-size: .72rem; text-align: center; margin: 10px 4px 0; }

  /* Modales */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal { position: fixed; left: 50%; top: 50%; z-index: 51; width: min(92vw, 420px); max-height: 86vh; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; opacity: 0; pointer-events: none; transform: translate(-50%, -46%) scale(.96); transition: opacity .25s ease, transform .25s ease; }
  .modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .modal h3 { margin: 0 0 8px; font-size: 1.1rem; }
  .modal p { margin: 8px 0; font-size: .9rem; }
  .m-item { color: var(--accent-2); font-weight: 700; }
  .m-sub, .fine { color: var(--muted); font-size: .78rem; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 14px; border: 0; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; margin-top: 8px; text-align: center; }
  .btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  .btn.ghost { background: var(--card-2); color: var(--text); }
  .btn.disabled { opacity: .5; pointer-events: none; }
  .player { position: relative; height: 140px; border-radius: 14px; background: #000; color: #fff; display: grid; place-items: center; overflow: hidden; margin: 10px 0 4px; }
  .player .demo-tag { position: absolute; top: 8px; left: 8px; background: #ffb300; color: #1b1f3b; font-size: .65rem; font-weight: 800; padding: 2px 6px; border-radius: 5px; }
  .player .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.2); }
  .player .prog span { display: block; height: 100%; width: 0; background: var(--accent-2); transition: width 1s linear; }
  .benefits { list-style: none; padding: 0; margin: 10px 0; }
  .benefits li { padding: 6px 0; font-size: .9rem; }
  .benefits li::before { content: "✓ "; color: var(--accent-2); font-weight: 800; }
  .pro-active { background: rgba(34,211,166,.15); border: 1px solid var(--accent-2); color: var(--accent-2); border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; }
  .code-row { display: flex; gap: 8px; margin-top: 8px; }
  .code-row input { flex: 1; min-width: 0; background: var(--card-2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 16px; outline: none; }
  .code-row button { flex: none; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 0 14px; font-weight: 700; cursor: pointer; }
  .offer { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); background: var(--card-2); border-radius: 14px; padding: 13px; margin-top: 8px; }
  .offer .oi { font-size: 1.4rem; }
  .offer b { display: block; font-size: .9rem; }
  .offer small { display: block; color: var(--muted); font-size: .75rem; }
  .offer.disabled { opacity: .55; pointer-events: none; }
  .custom-wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 70px; }
  .add-row { display: flex; gap: 8px; padding: 4px 12px 14px; }
  .add-row input { flex: 1; min-width: 0; background: var(--card-2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 16px; outline: none; }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button { flex: none; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .del-btn { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
  .legal h4 { margin: 14px 0 4px; font-size: .9rem; }
  .legal p { margin: 0; color: var(--muted); font-size: .8rem; }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px); background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s; z-index: 60; text-align: center; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="title-row">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3a6"/></linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#lg)"/>
        <path d="M32 11l17 8v16c0 9-7 14-17 18-10-4-17-9-17-18V19z" fill="#0f1222" opacity=".28"/>
        <path d="M21 33l8 8 15-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 8v8M46 12h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="brand">
        <h1>Loot<span>Log</span></h1>
        <div class="subtitle" data-i18n="tagline"></div>
      </div>
      <button class="icon-btn" id="langBtn" aria-label="Idioma / Idioma">ES</button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">⚙️</button>
    </div>
    <div class="stat-row">
      <span class="game" data-i18n="gameName"></span>
      <span><b id="pct">0%</b> · <span id="count">0 / 0</span></span>
    </div>
    <div class="bar"><span id="totalBar"></span></div>
    <div class="orbs" id="orbs">
      <span data-i18n="orbsTitle"></span>
      <span class="orb-list" id="orbList"></span>
      <b id="orbCount">0/7</b>
    </div>
    <div class="tools">
      <input type="search" id="search" autocomplete="off">
      <button class="chip" id="hideDone" data-i18n="hideDone"></button>
    </div>
  </div>
</header>

<main id="app"></main>
<div class="empty" id="empty" data-i18n="noResults"></div>
<div class="custom-wrap" id="customWrap"></div>

<div class="support-card" id="supportCard">
  <a id="supportLink" href="#" target="_blank" rel="noopener">
    <span style="font-size:1.4rem">☕</span>
    <span><b data-i18n="supportTitle"></b><small data-i18n="supportDesc"></small></span>
  </a>
</div>

<!-- Banner publicitario SIMULADO -->
<div class="ad-banner" id="adBanner" role="complementary">
  <span class="ad-tag">AD</span>
  <span class="ad-text" data-i18n="adText"></span>
  <button class="ad-remove" id="adRemove" data-i18n="removeAds"></button>
</div>

<!-- Hoja de opciones -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog">
  <div class="grab"></div>
  <h2 data-i18n="options"></h2>
  <button class="opt" id="optPro"><span class="oi">⭐</span><span><span data-i18n="menuPro"></span><small id="proStatus"></small></span></button>
  <button class="opt" id="optOffers"><span class="oi">🛍️</span><span><span data-i18n="menuOffers"></span><small data-i18n="menuOffersDesc"></small></span></button>
  <button class="opt" id="optTheme"><span class="oi">🌗</span><span><span data-i18n="theme"></span><small id="themeLabel"></small></span></button>
  <button class="opt" id="optExport"><span class="oi">📤</span><span><span data-i18n="export"></span><small data-i18n="exportDesc"></small></span></button>
  <button class="opt" id="optImport"><span class="oi">📥</span><span><span data-i18n="import"></span><small data-i18n="importDesc"></small></span></button>
  <button class="opt" id="optInstall" style="display:none"><span class="oi">📲</span><span><span data-i18n="install"></span><small data-i18n="installDesc"></small></span></button>
  <a class="opt" id="optSupport" href="#" target="_blank" rel="noopener" style="display:none"><span class="oi">☕</span><span><span data-i18n="supportTitle"></span><small data-i18n="supportDesc"></small></span></a>
  <button class="opt" id="optLegal"><span class="oi">📄</span><span><span data-i18n="menuLegal"></span><small data-i18n="menuLegalDesc"></small></span></button>
  <button class="opt danger" id="optReset"><span class="oi">🗑️</span><span><span data-i18n="reset"></span><small data-i18n="resetDesc"></small></span></button>
  <p class="privacy" data-i18n="privacy"></p>
</div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<!-- Modales -->
<div class="modal-overlay" id="modalOverlay"></div>

<div class="modal" id="modalAd" role="dialog" aria-modal="true">
  <h3 data-i18n="adTitle"></h3>
  <div id="adIntro">
    <p class="m-item" id="adItemName"></p>
    <p data-i18n="adMsg"></p>
    <button class="btn primary" id="adWatch" data-i18n="adWatch"></button>
    <button class="btn ghost" id="adGoPro" data-i18n="adGoPro"></button>
    <button class="btn ghost" data-close data-i18n="cancel"></button>
  </div>
  <div id="adPlayer" hidden>
    <div class="player">
      <span class="demo-tag" data-i18n="adDemo"></span>
      <div id="adCountdown"></div>
      <div class="prog"><span id="adProg"></span></div>
    </div>
    <p class="fine" data-i18n="adWait"></p>
    <button class="btn ghost" data-close data-i18n="cancel"></button>
  </div>
</div>

<div class="modal" id="modalPro" role="dialog" aria-modal="true">
  <h3 data-i18n="proTitle"></h3>
  <p class="m-sub" data-i18n="proSub"></p>
  <ul class="benefits" id="proBenefits"></ul>
  <div id="proBody"></div>
  <button class="btn ghost" data-close data-i18n="close"></button>
</div>

<div class="modal" id="modalOffers" role="dialog" aria-modal="true">
  <h3 data-i18n="offersTitle"></h3>
  <p class="m-sub" data-i18n="offersDesc"></p>
  <div id="offersList"></div>
  <p class="fine" data-i18n="disclosure"></p>
  <button class="btn ghost" data-close data-i18n="close"></button>
</div>

<div class="modal" id="modalLegal" role="dialog" aria-modal="true">
  <h3 data-i18n="legalTitle"></h3>
  <div id="legalBody" class="legal"></div>
  <button class="btn ghost" data-close data-i18n="close"></button>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURACIÓN / CONFIGURAÇÃO  — edita solo este bloque
   ========================================================= */

const STORAGE_KEY = "lootlog-v1";
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return {};
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
const state = loadState();
state.checked ||= {}; state.open ||= {}; state.hints ||= {}; state.parts ||= {};

  ? state.custom.filter(c => c && typeof c.id === "string" && typeof c.t === "string")
      .slice(0, 100).map(c => ({ id: c.id.slice(0, 20), t: c.t.slice(0, 60), d: !!c.d }))
  : [];
state.theme ||= "auto"; state.hideDone ||= false;
if (!state.lang) state.lang = (navigator.language || "es").toLowerCase().startsWith("pt") ? "pt" : "es";

/* PRO: isProUser = "true" solo cuenta si hay además un token válido (huella de un código real).
   Así, editar isProUser a mano desde las herramientas del navegador ya no basta. */
let verifiedLicense = "";   // licencia cuya firma ya se verificó en este dispositivo
function validToken(t) {
  return (t === "demo" && CONFIG.demoMode) || CONFIG.proHashes.includes(t) ||
         (typeof t === "string" && t.startsWith("LL1-") && t === verifiedLicense);
}
function b64uToBytes(x) {
  x = x.replace(/-/g, "+").replace(/_/g, "/");
  while (x.length % 4) x += "=";
  return Uint8Array.from(atob(x), c => c.charCodeAt(0));
}
/* Verifica la firma de una licencia emitida por tu Worker (clave pública en CONFIG.licensePub). */
async function verifyLicense(token) {
  try {
    if (!CONFIG.licensePub || typeof token !== "string") return false;
    const m = /^LL1-(\d{5,20})\.([A-Za-z0-9_-]{80,100})$/.exec(token);
    if (!m) return false;
    const key = await crypto.subtle.importKey("jwk", CONFIG.licensePub, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
    return await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, b64uToBytes(m[2]), new TextEncoder().encode("lootlog1." + m[1]));
  } catch (e) { return false; }
}
function isPro() {
  try { return localStorage.getItem("isProUser") === "true" && validToken(localStorage.getItem("proToken")); }
  catch (e) { return false; }
}
function writePro(v, token) {
  try {
    localStorage.setItem("isProUser", v ? "true" : "false");
    if (v) localStorage.setItem("proToken", token || ""); else localStorage.removeItem("proToken");
  } catch (e) {}
}
{ // limpia valores manipulados (las licencias firmadas se comprueban más abajo, de forma asíncrona)
  let tk = ""; try { tk = localStorage.getItem("proToken") || ""; } catch (e) {}
  if (!isPro() && !tk.startsWith("LL1-")) writePro(false);
}

async function sha256Hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

      <div class="items"></div>`;

    const list = section.querySelector(".items");
    cat.items.forEach(item => {
      const row = document.createElement("label");
      row.className = "item";
      row.dataset.id = item.id;
      row.dataset.name = (item.name.join(" ") + " " + (item.note ? item.note.join(" ") : "") + " " + (item.parts ? item.parts.join(" ") : "")).toLowerCase();
      row.innerHTML = `
        <input type="checkbox">
        <span class="box">✓</span>
        <span class="label">${item.name[i]}${item.note ? `<small>${item.note[i]}</small>` : ""}<small class="hint"></small></span>`;
      const input = row.querySelector("input");
      input.checked = !!state.checked[item.id];
      row.classList.toggle("checked", input.checked);
      input.addEventListener("change", () => {
        if (input.checked) state.checked[item.id] = true; else delete state.checked[item.id];
        row.classList.toggle("checked", input.checked);
        if (navigator.vibrate) navigator.vibrate(15);
        saveState(); updateProgress(); applyFilters();
      });

      // Botón de pista
      if (item.hint) {
        const unlocked = hasHint(item.id);
        row.querySelector(".hint").textContent = item.hint[i];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "hint-btn" + (unlocked ? " unlocked" : "");
        btn.textContent = unlocked ? "💡" : "🔒";
        btn.setAttribute("aria-label", T().hintAria);
        btn.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          if (hasHint(item.id)) row.classList.toggle("hint-open");
          else if (CONFIG.adsEnabled) openAdModal(item.id);
          else { showToast(T().hintProOnly); openProModal(); }
        });
        row.appendChild(btn);
        if (keepOpen.has(item.id) && unlocked) row.classList.add("hint-open");
      }
      list.appendChild(row);

      // Objetos individuales del paquete
      if (item.parts) {
        const pbtn = document.createElement("button");
        pbtn.type = "button";
        pbtn.className = "parts-btn";
        pbtn.setAttribute("aria-label", T().partsAria);
        const box = document.createElement("div");
        box.className = "parts";
        const refresh = () => {
          const n = partsDone(item);
          pbtn.textContent = (row.classList.contains("parts-open") ? "▾ " : "▸ ") + n + "/" + item.need;
          pbtn.classList.toggle("full", n >= item.need);
        };
        item.parts.forEach((pname, k) => {
          const key = item.id + ":" + k;
          const lab = document.createElement("label");
          lab.className = "part" + (state.parts[key] ? " on" : "");
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = !!state.parts[key];
          const pb = document.createElement("span"); pb.className = "pbox"; pb.textContent = "✓";
          const tx = document.createElement("span"); tx.className = "ptxt"; tx.textContent = pname;
          lab.append(cb, pb, tx);
          cb.addEventListener("change", () => {
            if (cb.checked) state.parts[key] = true; else delete state.parts[key];
            lab.classList.toggle("on", cb.checked);
            const done = partsDone(item) >= item.need;
            if (done) state.checked[item.id] = true; else delete state.checked[item.id];
            input.checked = done;
            row.classList.toggle("checked", done);
            if (navigator.vibrate) navigator.vibrate(10);
            refresh(); saveState(); updateProgress(); applyFilters();
          });
          box.appendChild(lab);
        });
        // Si se marca/desmarca el paquete completo, se sincronizan sus objetos
        input.addEventListener("change", () => {
          item.parts.forEach((_, k) => {
            const key = item.id + ":" + k;
            if (input.checked) state.parts[key] = true; else delete state.parts[key];
          });
          box.querySelectorAll(".part").forEach(l => {
            const on = input.checked;
            l.classList.toggle("on", on); l.querySelector("input").checked = on;
          });
          refresh(); saveState();
        });
        pbtn.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          row.classList.toggle("parts-open");
          refresh();
        });
        if (keepParts.has(item.id)) row.classList.add("parts-open");
        refresh();
        row.appendChild(pbtn);
        list.appendChild(box);
      }
    });

    section.querySelector(".cat-head").addEventListener("click", () => {
      const open = section.classList.toggle("open");
      state.open[cat.id] = open;
      section.querySelector(".cat-head").setAttribute("aria-expanded", open);
      saveState();
    });
    app.appendChild(section);
  });
  lastComplete = isComplete();
  { const o = orbsState(); lastOrbsFull = o.n > 0 && o.on === o.n; }
  renderCustom();
  updateProgress(); applyFilters();
}

/* =========================================================
   7) PROGRESO
   ========================================================= */
function isComplete() {
  const all = DATA.flatMap(c => c.items);
  return all.length > 0 && all.every(it => state.checked[it.id]);
}
let lastComplete = false;

const ORB_CAT = "reliquias";
let lastOrbsFull = false;
function orbsState() {
  const cat = DATA.find(c => c.id === ORB_CAT);
  if (!cat) return { on: 0, n: 0 };
  return { on: cat.items.filter(it => state.checked[it.id]).length, n: cat.items.length };
}
function updateOrbs() {
  const box = $("orbs");
  const { on, n } = orbsState();
  if (!n) { box.style.display = "none"; return; }
  const list = $("orbList");
  list.innerHTML = "";
  for (let k = 0; k < n; k++) {
    const d = document.createElement("span");
    d.className = "orb" + (k < on ? " on" : "");
    list.appendChild(d);
  }
  $("orbCount").textContent = `${on}/${n}`;
  const full = on === n;
  box.classList.toggle("full", full);
  if (full && !lastOrbsFull) {
    showToast(T().orbsSummoned);
    if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  }
  lastOrbsFull = full;
}

function updateProgress() {
  let total = 0, done = 0;
  DATA.forEach(cat => {
    const n = cat.items.length;
    const d = cat.items.filter(it => state.checked[it.id]).length;
    total += n; done += d;
    const sec = app.querySelector(`[data-cat="${cat.id}"]`);
    if (!sec) return;
    sec.querySelector(".cat-count").textContent = d === n ? `${T().complete} (${n}/${n})` : `${d} / ${n}`;
    sec.querySelector(".mini-bar span").style.width = (n ? d / n * 100 : 0) + "%";
    sec.classList.toggle("done", d === n);
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  $("pct").textContent = pct + "%";
  $("count").textContent = `${done} / ${total}`;
  $("totalBar").style.width = pct + "%";
  updateOrbs();
  const complete = total > 0 && done === total;
  if (complete && !lastComplete) showToast(T().allDone);
  lastComplete = complete;
}

const searchEl = $("search");
const hideBtn = $("hideDone");
function applyFilters() {
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;
  app.querySelectorAll(".category").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".item").forEach(row => {
      const show = (!q || row.dataset.name.includes(q)) && !(state.hideDone && row.classList.contains("checked"));
      row.classList.toggle("hidden", !show);
      if (show) n++;
    });
    sec.style.display = n ? "" : "none";
    if (q && n) sec.classList.add("open");
    else if (!q) sec.classList.toggle("open", !!state.open[sec.dataset.cat]);
    visible += n;
  });
  $("empty").style.display = visible ? "none" : "block";
  hideBtn.classList.toggle("active", !!state.hideDone);
}

/* showRewardedAd(itemId): SIMULADA.
   Para usar anuncios reales, sustituye el temporizador por el SDK de tu red
   publicitaria (en web: Google Ad Manager / AdSense for Games, u otra red que
   ofrezca anuncios recompensados) y llama a onRewarded(itemId) SOLO en su
   callback de "recompensa concedida". */
function showRewardedAd(itemId) {
  stopAd();
  adItem = itemId;
  $("adIntro").hidden = true;
  $("adPlayer").hidden = false;
  let left = AD_SECONDS;
  $("adProg").style.transition = "none";
  $("adProg").style.width = "0%";
  $("adCountdown").textContent = T().adCountdown(left);
  void $("adProg").offsetWidth;
  $("adProg").style.transition = "";
  adTimer = setInterval(() => {
    left--;
    $("adProg").style.width = ((AD_SECONDS - left) / AD_SECONDS * 100) + "%";
    $("adCountdown").textContent = T().adCountdown(Math.max(left, 0));
    if (left <= 0) { stopAd(); onRewarded(itemId); }
  }, 1000);
  requestAnimationFrame(() => { $("adProg").style.width = (1 / AD_SECONDS * 100) + "%"; });
}
function stopAd() { if (adTimer) { clearInterval(adTimer); adTimer = null; } }

function onRewarded(itemId) {
  unlockHint(itemId);
  closeModal();
}
function unlockHint(itemId) {
  state.hints[itemId] = true;

/* ---------- Pago automático ---------- */
let pendingPay = "";
async function api(path, body) {
  const r = await fetch(CONFIG.apiUrl.replace(/\/$/, "") + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {})
  });
  return r.json();
}
async function startCheckout() {
  try {
    showToast(T().payOpening);
    const d = await api("/create");
    // Solo se abre si el enlace es realmente de Mercado Pago
    if (d && typeof d.init_point === "string" && /^https:\/\/([a-z0-9-]+\.)*mercadopago\.com(\.[a-z]{2})?\//.test(d.init_point)) location.href = d.init_point;
    else showToast(T().payError);
  } catch (e) { showToast(T().payError); }
}
async function claimPayment(paymentId) {
  try {
    const d = await api("/claim", { payment_id: String(paymentId) });
    if (d && d.status === "ok" && await verifyLicense(d.token)) {
      verifiedLicense = d.token;
      setPro(true, d.token);
      openProModal();
      return true;
    }
    if (d && d.status === "pending") { pendingPay = String(paymentId); showToast(T().payPending); }
    else if (d && d.status === "slow_down") showToast(T().payWait);
    else showToast(T().payNotFound);
  } catch (e) { showToast(T().payError); }
  return false;
}
function handleReturnFromPayment() {
  if (!CONFIG.apiUrl) return;
  let q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  const id = q.get("payment_id") || q.get("collection_id");
  if (!id || !/^\d{5,20}$/.test(id)) return;
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (isPro()) return;
  claimPayment(id).then(ok => { if (!ok) openProModal(); });
}

function renderProModal() {
  const t = T();
  $("proBenefits").innerHTML = "";
  t.proBenefits.forEach(b => $("proBenefits").appendChild(mk("li", "", b)));
  const body = $("proBody");
  body.innerHTML = "";

  if (isPro()) {
    body.appendChild(mk("div", "pro-active", t.proActive));

    if (tk.startsWith("LL1-")) {
      body.appendChild(mk("p", "fine", t.licenseSave));
      const cp = mk("button", "btn ghost", "📋 " + t.licenseCopy); cp.type = "button";
      cp.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(tk); showToast(t.licenseCopied); } catch (e) { showToast(tk); }
      });
      body.appendChild(cp);
    }
    if (CONFIG.demoMode) {
      const b = mk("button", "btn ghost", t.proDeactivate); b.type = "button";
      b.addEventListener("click", () => { setPro(false); renderProModal(); });
      body.appendChild(b);
    }
  } else {
    const wa = (CONFIG.whatsapp || "").replace(/\D/g, "");
    if (CONFIG.apiUrl) {
      const pay = mk("button", "btn primary", "⭐ " + t.payBtn); pay.type = "button";
      pay.addEventListener("click", startCheckout);
      body.appendChild(pay);
      body.appendChild(mk("p", "fine", t.payNote));
      body.appendChild(mk("p", "fine", t.payHaveNum));
      const vr = mk("div", "code-row");
      const vi = mk("input"); vi.type = "text"; vi.inputMode = "numeric"; vi.autocomplete = "off";
      vi.placeholder = t.payNumPH; vi.maxLength = 20; vi.value = pendingPay;
      const vb = mk("button", "", t.payVerify); vb.type = "button";
      vb.addEventListener("click", async () => {
        const v = vi.value.replace(/\D/g, "");
        if (v.length < 5) { showToast(t.payNotFound); return; }
        vb.disabled = true; await claimPayment(v); vb.disabled = false;
      });
      vr.append(vi, vb);
      body.appendChild(vr);
      if (wa.length >= 10) body.appendChild(mkLink("btn ghost", "💬 " + t.payHelp, "https://wa.me/" + wa + "?text=" + encodeURIComponent(t.proWaMsg)));
    } else {
      if (CONFIG.proUrl) body.appendChild(mkLink("btn primary", "⭐ " + t.proBuy, CONFIG.proUrl));
      if (CONFIG.proUrl && wa.length >= 10) {
        body.appendChild(mk("p", "fine", t.proAfterPay));
        body.appendChild(mkLink("btn ghost", "💬 " + t.proWhatsapp, "https://wa.me/" + wa + "?text=" + encodeURIComponent(t.proWaMsg)));
      }
    }

    if (CONFIG.proHashes.length || CONFIG.licensePub) {
      const row = mk("div", "code-row");
      const inp = mk("input"); inp.type = "text"; inp.placeholder = t.proCodePH;
      inp.autocomplete = "off"; inp.autocapitalize = "none"; inp.maxLength = 140;
      const go = mk("button", "", t.proActivate); go.type = "button";
      go.addEventListener("click", async () => {
        if (Date.now() < lockUntil) { showToast(t.proLocked); return; }
        const raw = inp.value.trim();
        const code = raw.toUpperCase();
        if (!code) return;
        if (raw.startsWith("LL1-")) {   // licencia firmada (pago automático)
          if (await verifyLicense(raw)) { verifiedLicense = raw; setPro(true, raw); renderProModal(); return; }
          if (++badTries >= 5) { lockUntil = Date.now() + 30000; badTries = 0; }
          showToast(t.proBadCode); return;
        }
        try {
          const h = await sha256Hex("lootlog:" + code);
          if (CONFIG.proHashes.includes(h)) { badTries = 0; setPro(true, h); renderProModal(); return; }
        } catch (e) { showToast(t.proNeedsHttps); return; }
        if (++badTries >= 5) { lockUntil = Date.now() + 30000; badTries = 0; }
        showToast(t.proBadCode);
      });
      row.append(inp, go);
      body.appendChild(row);
    }

    if (CONFIG.demoMode) {
      const d = mk("button", "btn ghost", t.proDemo); d.type = "button";
      d.addEventListener("click", () => { setPro(true, "demo"); renderProModal(); });
      body.appendChild(d);
    }
    if (!CONFIG.proUrl && !CONFIG.demoMode) body.appendChild(mk("p", "fine", t.proSoon));

  if (CONFIG.supportUrl) body.appendChild(mkLink("btn ghost", t.donate, CONFIG.supportUrl));
  if (CONFIG.pixKey) {

      catch (e) { showToast(CONFIG.pixKey); }
    });
    body.appendChild(px);
  }
  const lg = mk("button", "btn ghost", t.menuLegal); lg.type = "button";
  lg.addEventListener("click", openLegalModal);
  body.appendChild(lg);
}

const FREE_CUSTOM = 5, MAX_CUSTOM = 100;
function renderCustom() {
  const t = T(), w = $("customWrap");
  w.innerHTML = "";

  head.appendChild(info);

  const box = mk("div", "items"); box.style.display = "block";
  state.custom.forEach(c => {
    const row = mk("label", "item" + (c.d ? " checked" : ""));
    const inp = mk("input"); inp.type = "checkbox"; inp.checked = c.d;
    inp.addEventListener("change", () => { c.d = inp.checked; saveState(); renderCustom(); });
    row.appendChild(inp);
    row.appendChild(mk("span", "box", "✓"));
    row.appendChild(mk("span", "label", c.t));
    const del = mk("button", "del-btn", "✕"); del.type = "button";
    del.setAttribute("aria-label", t.customDel);
    del.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      state.custom = state.custom.filter(x => x.id !== c.id);
      saveState(); renderCustom();
    });
    row.appendChild(del);
    box.appendChild(row);
  });
  card.appendChild(box);

  const add = mk("div", "add-row");
  const field = mk("input"); field.type = "text"; field.maxLength = 60; field.placeholder = t.customPH;
  const btn = mk("button", "", t.customAdd); btn.type = "button";
  const doAdd = () => {
    const v = field.value.trim().slice(0, 60);
    if (!v) return;
    const max = isPro() ? MAX_CUSTOM : FREE_CUSTOM;
    if (state.custom.length >= max) {
      showToast(isPro() ? t.customMax : t.customLimit(FREE_CUSTOM));
      if (!isPro()) openProModal();
      return;
    }
    state.custom.push({ id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: v, d: false });
    saveState(); renderCustom();
  };
  btn.addEventListener("click", doAdd);
  field.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doAdd(); } });
  add.append(field, btn);
  card.appendChild(add);
  w.appendChild(card);
}

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lootlog-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  closeSheet(); showToast(T().exported);
});

const fileInput = $("fileInput");
$("optImport").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (file.size > 100000) { showToast(T().badFile); fileInput.value = ""; return; }   // límite de tamaño
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.checked)) throw new Error("format");
      const valid = new Set(DATA.flatMap(c => c.items.map(it => it.id)));
      const ids = data.checked.filter(id => valid.has(id));
      if (!confirm(T().confirmImport(ids.length))) return;
      state.checked = {}; ids.forEach(id => state.checked[id] = true);
      state.parts = {};
      if (Array.isArray(data.parts)) {
        const okParts = new Set(DATA.flatMap(c => c.items.flatMap(it => (it.parts || []).map((_, k) => it.id + ":" + k))));
        data.parts.filter(k => okParts.has(k)).forEach(k => state.parts[k] = true);
      }
      if (Array.isArray(data.hints)) {
        state.hints = {}; data.hints.filter(id => valid.has(id)).forEach(id => state.hints[id] = true);
      }
      if (Array.isArray(data.custom)) {
        const max = isPro() ? MAX_CUSTOM : FREE_CUSTOM;
        state.custom = data.custom
          .filter(c => c && typeof c.t === "string" && c.t.trim())
          .slice(0, max)
          .map((c, k) => ({ id: "u" + Date.now().toString(36) + k, t: c.t.trim().slice(0, 60), d: !!c.d }));
      }
      saveState(); render(); closeSheet(); showToast(T().imported);
    } catch (e) { showToast(T().badFile); }
  };
  reader.readAsText(file);
  fileInput.value = "";
});

$("optReset").addEventListener("click", () => {
  if (confirm(T().confirmReset)) {
    state.checked = {}; state.parts = {}; state.custom.forEach(c => c.d = false);
    saveState(); render(); closeSheet(); showToast(T().resetDone);
  }
});

/* Apoyo voluntario: solo se muestra si configuraste supportUrl */
(function setupSupport() {
  if (!CONFIG.supportUrl) return;
  $("supportCard").style.display = "block";
  $("supportLink").href = CONFIG.supportUrl;
  const o = $("optSupport");
  o.style.display = "flex"; o.href = CONFIG.supportUrl;
})();

/* =========================================================
   14) TOAST
   ========================================================= */
let toastTimer;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

/* =========================================================
   15) PWA (requiere https:// o localhost)
   ========================================================= */
(function setupPWA() {
  const icon = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3a6"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><path d="M32 11l17 8v16c0 9-7 14-17 18-10-4-17-9-17-18V19z" fill="#0f1222" opacity=".28"/><path d="M21 33l8 8 15-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  const manifest = {
    name: "LootLog", short_name: "LootLog",
    start_url: location.href.split("#")[0], display: "standalone",
    background_color: "#0f1222", theme_color: "#0f1222",
    icons: [{ src: icon, sizes: "any", type: "image/svg+xml", purpose: "any" }]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  document.head.appendChild(link);
  const ai = document.createElement("link");
  ai.rel = "apple-touch-icon"; ai.href = icon; document.head.appendChild(ai);

  let deferred;
  const installBtn = $("optInstall");
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installBtn.style.display = "flex"; });
  installBtn.addEventListener("click", async () => {
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice;
    deferred = null; installBtn.style.display = "none"; closeSheet();
  });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();

applyLang();
applyTheme();
applyPro();
render();

(async function initLicenseAndReturn() {
  let tk = ""; try { tk = localStorage.getItem("proToken") || ""; } catch (e) {}
  if (tk.startsWith("LL1-")) {
    if (await verifyLicense(tk)) verifiedLicense = tk; else writePro(false);
    applyPro(); render();
  }
  handleReturnFromPayment();
})();
</script>
